[project]
name = "voice-receptionist"
version = "0.1.0"
description = "A phone receptionist voice agent on LiveKit Agents, with a small admin UI and evals"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents==1.8.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
